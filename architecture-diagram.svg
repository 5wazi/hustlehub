<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="600" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">HustleHub - System Architecture (Part 2)</text>
  <text x="600" y="54" text-anchor="middle" font-size="12.5" fill="#6b7280">React SPA + Express API over HTTPS, with security controls and trust boundaries</text>

  <!-- Untrusted -->
  <rect x="30" y="80" width="270" height="640" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="165" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">UNTRUSTED ZONE (Browser / Internet)</text>
  <rect x="50" y="125" width="230" height="270" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="165" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">React SPA (Vite)</text>
  <text x="165" y="176" text-anchor="middle" font-size="11" fill="#1e3a8a">Pages: Login, Register, Browse gigs,</text>
  <text x="165" y="192" text-anchor="middle" font-size="11" fill="#1e3a8a">My gigs, Bookings, Income, Admin</text>
  <text x="165" y="218" text-anchor="middle" font-size="11" fill="#1e3a8a">AuthContext + ProtectedRoute (UX only)</text>
  <text x="165" y="244" text-anchor="middle" font-size="11" fill="#1e3a8a">API client attaches Bearer JWT</text>
  <text x="165" y="270" text-anchor="middle" font-size="11" fill="#1e3a8a">Client-side validation (convenience)</text>
  <text x="165" y="296" text-anchor="middle" font-size="11" fill="#1e3a8a">React output escaping (no raw HTML)</text>
  <text x="165" y="322" text-anchor="middle" font-size="11" fill="#1e3a8a">JWT in sessionStorage (tab-scoped)</text>
  <text x="165" y="352" text-anchor="middle" font-size="10" fill="#475569">Tests: Vitest + Testing Library</text>
  <rect x="50" y="420" width="230" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="165" y="448" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">Postman / Newman</text>
  <text x="165" y="470" text-anchor="middle" font-size="11" fill="#1e3a8a">67-request API test suite</text>
  <text x="165" y="488" text-anchor="middle" font-size="10" fill="#475569">HTML report evidence</text>

  <line x1="300" y1="250" x2="360" y2="250" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="360" y1="280" x2="300" y2="280" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="330" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">HTTPS</text>
  <text x="330" y="300" text-anchor="middle" font-size="9.5" fill="#6b7280">TLS</text>

  <!-- Trust boundary -->
  <rect x="360" y="80" width="560" height="640" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="640" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b91c1c">TRUST BOUNDARY - Node.js / Express (HTTPS)</text>

  <rect x="385" y="120" width="510" height="50" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="640" y="142" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">Perimeter</text>
  <text x="640" y="159" text-anchor="middle" font-size="10.5" fill="#7f1d1d">Helmet + Content Security Policy · CORS allow-list · 10kb body limit · API rate limit</text>

  <rect x="385" y="182" width="510" height="44" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="640" y="202" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">Sanitisation</text>
  <text x="640" y="218" text-anchor="middle" font-size="10.5" fill="#7f1d1d">Strip $ / __proto__ keys · strip HTML tags · type checks</text>

  <rect x="385" y="240" width="250" height="62" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="510" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">Auth routes</text>
  <text x="510" y="278" text-anchor="middle" font-size="10.5" fill="#7c2d12">/auth/register · /auth/login</text>
  <text x="510" y="294" text-anchor="middle" font-size="10" fill="#9a3412">auth rate limiter</text>

  <rect x="645" y="240" width="250" height="62" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="770" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">Marketplace routes</text>
  <text x="770" y="278" text-anchor="middle" font-size="10.5" fill="#7c2d12">/gigs · /bookings · /transactions</text>
  <text x="770" y="294" text-anchor="middle" font-size="10" fill="#9a3412">/income · /admin  (booking rate limiter)</text>

  <rect x="385" y="316" width="510" height="62" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="640" y="338" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#312e81">requireAuth (JWT HS256 + user lookup)  →  requireRole (RBAC)</text>
  <text x="640" y="356" text-anchor="middle" font-size="10.5" fill="#312e81">client · freelancer · admin     then     express-validator rules</text>
  <text x="640" y="370" text-anchor="middle" font-size="10" fill="#4338ca">role is read from the store, not trusted from the token</text>

  <rect x="385" y="392" width="510" height="78" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="640" y="414" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#312e81">Controllers</text>
  <text x="640" y="432" text-anchor="middle" font-size="10.5" fill="#312e81">auth · gigs (ownership checks) · bookings (creates transaction)</text>
  <text x="640" y="448" text-anchor="middle" font-size="10.5" fill="#312e81">transactions / income (tax estimate) · admin</text>
  <text x="640" y="463" text-anchor="middle" font-size="10" fill="#4338ca">server-side price · whitelisted fields · asyncHandler</text>

  <rect x="385" y="484" width="250" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="510" y="508" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">bcrypt (12 rounds)</text>
  <text x="510" y="525" text-anchor="middle" font-size="10.5" fill="#14532d">hash + compare, no plain text</text>
  <rect x="645" y="484" width="250" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="770" y="508" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">JWT utility</text>
  <text x="770" y="525" text-anchor="middle" font-size="10.5" fill="#14532d">sign / verify, 1h expiry</text>

  <rect x="385" y="554" width="510" height="46" rx="8" fill="#fce7f3" stroke="#db2777"/>
  <text x="640" y="574" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#831843">Centralised error handler</text>
  <text x="640" y="590" text-anchor="middle" font-size="10.5" fill="#831843">generic client messages · details logged server-side only</text>

  <rect x="385" y="614" width="510" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="640" y="636" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Data layer (file-backed JSON collections)</text>
  <text x="640" y="656" text-anchor="middle" font-size="10.5" fill="#1f2937">users.json · gigs.json · bookings.json · transactions.json</text>
  <text x="640" y="674" text-anchor="middle" font-size="10.5" fill="#1f2937">only models/ touches the files → swap for MongoDB later</text>
  <text x="640" y="692" text-anchor="middle" font-size="10" fill="#6b7280">passwordHash never leaves this layer</text>

  <!-- arrows -->
  <line x1="640" y1="170" x2="640" y2="182" stroke="#374151" marker-end="url(#a)"/>
  <line x1="510" y1="226" x2="510" y2="240" stroke="#374151" marker-end="url(#a)"/>
  <line x1="770" y1="226" x2="770" y2="240" stroke="#374151" marker-end="url(#a)"/>
  <line x1="640" y1="302" x2="640" y2="316" stroke="#374151" marker-end="url(#a)"/>
  <line x1="640" y1="378" x2="640" y2="392" stroke="#374151" marker-end="url(#a)"/>
  <line x1="640" y1="470" x2="640" y2="484" stroke="#374151" marker-end="url(#a)"/>
  <line x1="640" y1="600" x2="640" y2="614" stroke="#374151" marker-end="url(#a)"/>

  <!-- Static + future -->
  <rect x="950" y="80" width="220" height="150" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="1060" y="106" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#713f12">Production serving</text>
  <text x="1060" y="130" text-anchor="middle" font-size="10.5" fill="#713f12">client/dist built by Vite is</text>
  <text x="1060" y="146" text-anchor="middle" font-size="10.5" fill="#713f12">served by Express on the</text>
  <text x="1060" y="162" text-anchor="middle" font-size="10.5" fill="#713f12">same HTTPS origin, so the</text>
  <text x="1060" y="178" text-anchor="middle" font-size="10.5" fill="#713f12">strict CSP ('self') applies</text>
  <text x="1060" y="204" text-anchor="middle" font-size="10" fill="#92400e">Dev: Vite proxies /api → HTTPS</text>

  <rect x="950" y="260" width="220" height="130" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1060" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5b21b6">FUTURE</text>
  <rect x="970" y="300" width="180" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="1060" y="328" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4c1d95">MongoDB</text>
  <text x="1060" y="348" text-anchor="middle" font-size="10" fill="#4c1d95">replaces JSON files</text>
  <line x1="895" y1="660" x2="1060" y2="370" stroke="#9ca3af" stroke-dasharray="4,3" marker-end="url(#a)"/>

  <text x="600" y="745" text-anchor="middle" font-size="10.5" fill="#6b7280">Dashed boxes = trust boundaries. Every request is authenticated, authorised, validated and rate limited server-side; the UI checks are convenience only.</text>
</svg>
